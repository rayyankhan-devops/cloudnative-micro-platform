# SonarQube Project Configuration
sonar.projectKey=cloudnative-micro-platform
sonar.projectName=Cloudnative Micro Platform

# Scan all frontend and microservice source code
sonar.sources=frontend/src,gateway/src,services/auth-service,services/payment-service/src,services/product-service/app

# Exclusions (dependencies, virtual environments, build artifacts)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**

# Test files directory
sonar.tests=frontend/test,gateway/test,services/payment-service/test,services/product-service/tests

# Encoding
sonar.sourceEncoding=UTF-8
