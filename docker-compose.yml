services:
  # ==========================================
  # 1. MySQL Database (Auth Service Storage)
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cloudnative
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. PostgreSQL Database (Product & Payment Storage)
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnative
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 3. Auth Service (Go 1.22 ~ 27.9 MB)
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    image: cloudnative-micro-auth:v1.0.0
    container_name: auth-service
    restart: always
    environment:
      PORT: 8001
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: auth_db
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      JWT_SECRET: supersecretjwtkey123
    ports:
      - "8001:8001"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - cloudnative

  # ==========================================
  # 4. Product Service (Python FastAPI ~ 293 MB)
  # ==========================================
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    image: cloudnative-micro-product:v1.0.0
    container_name: product-service
    restart: always
    environment:
      PORT: 8002
      POSTGRES_PRODUCT_HOST: postgres-db
      POSTGRES_PRODUCT_PORT: 5432
      POSTGRES_PRODUCT_DB: product_db
      POSTGRES_PRODUCT_USER: postgres
      POSTGRES_PRODUCT_PASSWORD: postgres
    ports:
      - "8002:8002"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - cloudnative

  # ==========================================
  # 5. Payment Service (Node.js ~ 87.7 MB)
  # ==========================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: cloudnative-micro-payment:v1.0.0
    container_name: payment-service
    restart: always
    environment:
      PORT: 8003
      POSTGRES_PAYMENT_HOST: postgres-db
      POSTGRES_PAYMENT_PORT: 5432
      POSTGRES_PAYMENT_DB: product_db
      POSTGRES_PAYMENT_USER: postgres
      POSTGRES_PAYMENT_PASSWORD: postgres
    ports:
      - "8003:8003"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - cloudnative

  # ==========================================
  # 6. API Gateway (Node.js Express ~ 87.5 MB)
  # ==========================================
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: cloudnative-micro-gateway:v1.0.0
    container_name: api-gateway
    restart: always
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8003
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - product-service
      - payment-service
    networks:
      - cloudnative

  # ==========================================
  # 7. Frontend Application (React Nginx ~ 20.9 MB)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudnative-micro-platform:v1.0.0
    container_name: frontend-app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - cloudnative

# Persistent Named Volumes for Database Storage
volumes:
  mysql-data:
    driver: local
  postgres-data:
    driver: local

# Internal Custom Bridge Network
networks:
  cloudnative:
    driver: bridge
