name: Docker-Scan

on:
  workflow_call:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile-path: ./frontend/Dockerfile
            context-path: ./frontend
            image-name: microcloud-frontend

          - dockerfile-path: ./gateway/Dockerfile
            context-path: ./gateway
            image-name: microcloud-gateway

          - dockerfile-path: ./services/auth-service/Dockerfile
            context-path: ./services/auth-service
            image-name: microcloud-auth-service

          - dockerfile-path: ./services/payment-service/Dockerfile
            context-path: ./services/payment-service
            image-name: microcloud-payment-service

          - dockerfile-path: ./services/product-service/Dockerfile
            context-path: ./services/product-service
            image-name: microcloud-product-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context-path }}
          file: ${{ matrix.dockerfile-path }}
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}:${{ github.sha }}

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate Trivy JSON Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.image-name }}.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.image-name }}
          path: trivy-${{ matrix.image-name }}.json
          retention-days: 5
