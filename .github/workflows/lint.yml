name: lint-check

on:
  workflow_call:

jobs:
  lint-javascript:
    name: Lint - ${{ matrix.folder }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folder:
          - frontend
          - gateway
          - service/payment-service

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - name: Install Dependencies
        run: npm i

      - name: Run ESLint
        run: npm run lint


  lint-go:
    name: Lint - Go
    runs-on: ubuntu-latest
    needs: lint-javascript

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: service/auth-service/go.sum

      - name: Install Dependencies
        working-directory: service/auth-service
        run: go mod download

      - name: Run Go Vet
        working-directory: service/auth-service
        run: go vet ./...


  lint-python:
    name: Lint - Python
    runs-on: ubuntu-latest
    needs: lint-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/product-service/requirements.txt

      - name: Install Dependencies
        working-directory: service/product-service
        run: pip install -r requirements.txt

      - name: Run Pylint
        working-directory: service/product-service
        run: pylint .