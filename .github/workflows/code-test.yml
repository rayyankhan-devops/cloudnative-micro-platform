name: code-test

on:
  workflow_call:

jobs:
  test-javascript:
    name: Test - ${{ matrix.folder }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folder:
          - frontend
          - gateway
          - services/payment-service

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - name: Install Dependencies
        run: npm i

      - name: Run Node Tests
        run: npm test


  test-go:
    name: Test - Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: services/auth-service/go.sum

      - name: Install Dependencies
        working-directory: services/auth-service
        run: go mod download

      - name: Run Go Tests
        working-directory: services/auth-service
        run: go test ./...


  test-python:
    name: Test - Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product-service/requirements.txt

      - name: Install Dependencies
        working-directory: services/product-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: services/product-service
        run: PYTHONPATH=. pytest